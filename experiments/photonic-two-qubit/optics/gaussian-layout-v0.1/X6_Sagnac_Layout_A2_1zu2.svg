 x="500" y="190" width="180" height="180" fill="none" stroke="#168071" stroke-dasharray="5 4"/><text x="500" y="185" font-size="11">Quellenbereich / Zugang von oben</text><path d="M60 705H160M60 700V710M160 700V710" stroke="#172033" stroke-width="2"/><text x="110" y="695" text-anchor="middle" font-size="12">100 mm real = 50 mm Druck</text><circle cx="590.1254544289202" cy="280.1254544289202" r="2" fill="none" stroke="#004d40" stroke-width="1.2"/><circle cx="590.1254544289202" cy="280.12545442892014" r="2" fill="none" stroke="#004d40" stroke-width="1.2"/><text x="608.1254544289202" y="296.1254544289202" font-size="10">K / Fokus u*</text><text x="875" y="155" font-size="15">BEZUG / RICHTUNGEN</text><text x="875" y="179" font-size="12">Draufsicht: Blick von +Z auf Tisch.</text><text x="875" y="200" font-size="12">+X rechts, +Y oben; Z = 75 mm.</text><text x="875" y="221" font-size="12">u = Z x k; v = Z (vertikal).</text><text x="875" y="242" font-size="12">H = u, V = v; lokale Achsen.</text><text x="875" y="273" font-size="12">405 nm Pumpweg</text><text x="875" y="294" font-size="12">Lila Linie; Ruecklauf ueber ISO/BD0.</text><text x="875" y="315" font-size="12">810 nm Sammelwege</text><text x="875" y="336" font-size="12">Rote Linie; A+/A-/B+/B- zu Fasern.</text><text x="875" y="367" font-size="15">NOMINALE EINSTELLUNG</text><text x="875" y="391" font-size="12">O04: f = 300.0 mm (Szenario).</text><text x="875" y="412" font-size="12">D u/v = 0.600 / 0.600 mm.</text><text x="875" y="433" font-size="12">M2 u/v = 1.20 / 1.20.</text><text x="875" y="454" font-size="12">K: 10 mm, n_p = 1.85.</text><text x="875" y="475" font-size="12">zR(K,u) = 226.08 mm.</text><text x="875" y="496" font-size="12">HD: 45 deg, Halbwell bei 405/810.</text><text x="875" y="517" font-size="12">M1 / M2: AOI jeweils 22.5 deg.</text><text x="875" y="538" font-size="12">DM / DB: AOI 45 deg.</text><text x="875" y="559" font-size="12">PBS: aussen 0, intern 45 deg.</text><text x="875" y="590" font-size="15">OFFENE FREIGABEN</text><text x="875" y="614" font-size="12">Reale Pumpe / Kaustik / Kovarianz</text><text x="875" y="635" font-size="12">KTP-Indizes, Schnitt, Polung, Ofen</text><text x="875" y="656" font-size="12">PBS-/HWP-Phasen und freie Apertur</text><text x="875" y="677" font-size="12">Dichroika: Plattenversatz / ABCD</text><text x="875" y="698" font-size="12">810-nm-Relais und Filterdicken</text><text x="875" y="719" font-size="12">Halter-CAD, Justage / Kollisionen</text><text x="875" y="750" font-size="12">Entwurf = keine Messbestaetigung.</text><text x="875" y="771" font-size="12">* Fokusmarker nur innerhalb K.</text><text x="875" y="792" font-size="12">Radien / Strahldicken nicht skaliert.</text><text x="875" y="813" font-size="12">Detektoren extern via vier Fasern.</text><text x="40" y="815" font-size="12">Optische Haupt-/Bezugsebenen, nicht Gehaeusemitten. Druckskalierung mit 100-mm-Balken pruefen. O04 und BOM: HOLD.</text></g></svg>
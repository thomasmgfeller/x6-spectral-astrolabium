name: X6 fingerprint contract
on:
  push:
    branches: [main, research/x6-fingerprint-v1]
    paths:
      - 'research/fingerprint_v1/**'
      - 'research/lorentz_n6/**'
      - 'FINGERPRINT_SOURCE_MANIFEST.json'
      - '.github/workflows/x6-fingerprint.yml'
  pull_request:
    paths:
      - 'research/fingerprint_v1/**'
      - 'research/lorentz_n6/**'
      - 'FINGERPRINT_SOURCE_MANIFEST.json'
      - '.github/workflows/x6-fingerprint.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r experiments/industrial-v1/requirements.txt
      - run: python tests/python/verify_manifest.py
      - run: python -m unittest discover -s research/fingerprint_v1/tests -v
      - run: python research/fingerprint_v1/validate.py research/fingerprint_v1/examples/separation-event.json research/fingerprint_v1/examples/physical-pilot-plan.json

name: CST-DUST extension stability
on:
  pull_request:
    paths:
      - 'research/rax_cqg/dust_collapse/extension_stability_v0_1/**'
      - 'research/rax_cqg/dust_collapse/extension_stability_publication.sha256'
      - 'research/rax_cqg/dust_collapse/reports/CST_DUST_Erweiterungsstabilitaet_v0_1.pdf'
      - 'research/rax_cqg/dust_collapse/packages/CST_DUST_Erweiterungsstabilitaet_v0_1_Pruefpaket.zip'
      - '.github/workflows/cst-dust-extension-stability.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extension-stability:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
    defaults:
      run:
        working-directory: research/rax_cqg/dust_collapse
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify published files and compare every archive entry
        run: |
          sha256sum -c extension_stability_publication.sha256
          unzip -q packages/CST_DUST_Erweiterungsstabilitaet_v0_1_Pruefpaket.zip -d "$RUNNER_TEMP/extension-stability"
          diff -qr extension_stability_v0_1 "$RUNNER_TEMP/extension-stability"
      - name: Replay rank, probability, weight and Abel checks
        run: |
          python -m pip install -r extension_stability_v0_1/requirements.txt
          python -B "$RUNNER_TEMP/extension-stability/verify.py"

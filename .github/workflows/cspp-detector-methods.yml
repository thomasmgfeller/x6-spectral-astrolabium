name: CSPP detector methods
on:
  pull_request:
    paths: ['research/cspp/detector_methods_v0_10/**', '.github/workflows/cspp-detector-methods.yml']
  push:
    branches: [main]
    paths: ['research/cspp/detector_methods_v0_10/**', '.github/workflows/cspp-detector-methods.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  method-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r research/cspp/detector_methods_v0_10/requirements.txt
      - name: Verify method registration precedes archive integration
        run: |
          python3 - <<'PY'
          import datetime, hashlib, json, pathlib, posixpath, subprocess
          root=pathlib.Path('research/cspp/detector_methods_v0_10')
          receipt=json.loads((root/'REGISTRATION.json').read_text())
          freeze=json.loads((root/'FREEZE.json').read_text())
          commit=receipt['commit_sha']
          for name,expected in freeze['files'].items():
              p=posixpath.normpath(str(root)+'/'+name)
              b=subprocess.check_output(['git','show',commit+':'+p])
              if hashlib.sha256(b).hexdigest()!=expected:
                  raise SystemExit('FAIL: source differs from public method freeze: '+p)
          stamp=int(subprocess.check_output(['git','show','-s','--format=%ct',commit]))
          start=datetime.datetime.fromisoformat(json.loads((root/'results/COMPUTE_128.json').read_text())['started_UTC']).timestamp()
          if not stamp<start:raise SystemExit('FAIL: integration precedes registration')
          print('PASS: archived development only, no fresh confirmation claim')
          PY
      - name: Verify controls, enclosures and separated scientific gates
        run: python3 -O -B research/cspp/detector_methods_v0_10/verify10a.py
      - name: Reproduce post-run descriptive report
        run: |
          python3 -O -B research/cspp/detector_methods_v0_10/report10.py --out /tmp/cspp-v10-description.json
          diff -u research/cspp/detector_methods_v0_10/results/DESCRIPTIVE.json /tmp/cspp-v10-description.json
  method-replay:
    needs: method-integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: precision128
            bits: 128
          - mode: precision192
            bits: 192
          - mode: baseline128
            bits: 128
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      REPLAY_MODE: ${{ matrix.mode }}
      REPLAY_BITS: ${{ matrix.bits }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r research/cspp/detector_methods_v0_10/requirements.txt
      - name: Replay every fixed archive slot and every spatial grid
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess, sys, tempfile
          root=pathlib.Path('research/cspp/detector_methods_v0_10').resolve()
          p=json.loads((root/'PROTOCOL.json').read_text())
          mode=os.environ['REPLAY_MODE'];bits=int(os.environ['REPLAY_BITS'])
          env=dict(os.environ)
          if mode=='baseline128':env['NPY_DISABLE_CPU_FEATURES']=p['cpu_modes'][1]
          else:env.pop('NPY_DISABLE_CPU_FEATURES',None)
          with tempfile.TemporaryDirectory(prefix='cspp-v10-ci-') as temp:
              out=pathlib.Path(temp)
              subprocess.run([sys.executable,'-B',str(root/'run10.py'),'--bits',str(bits),'--out',str(out)],env=env,check=True)
              sys.path.insert(0,str(root))
              from common10 import gzread, check, ctx
              from verify10a import compare
              from run10 import summarize
              ctx.prec=256
              actual=gzread(out/f'BENCHMARK_{bits}.json.gz')
              ref='BASELINE_128.json.gz' if mode=='baseline128' else f'BENCHMARK_{bits}.json.gz'
              checks=compare(actual,gzread(root/'results'/ref))
              expected=json.loads((root/'results'/f'DECISION_{bits}.json').read_text())
              check(summarize(actual['rows'])==expected,'unchanged complete decisions')
              stats=json.loads((out/f'COMPUTE_{bits}.json').read_text())
              check(stats['maximum_RSS_MiB']<4096 and stats['wall_seconds']<=p['resources']['wall_seconds_per_process'],'measured replay resource budget')
              if mode=='baseline128':check(stats['cpu_features_disabled']==p['cpu_modes'][1],'baseline CPU mask')
              print(json.dumps({'status':'PASS','mode':mode,'enclosed_comparisons':checks}))
          PY

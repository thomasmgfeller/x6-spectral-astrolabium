name: CSPP contract and scalar calibration
on:
  pull_request:
    paths: ['research/cspp/**', '.github/workflows/cspp-contract.yml']
  push:
    branches: [main]
    paths: ['research/cspp/**', '.github/workflows/cspp-contract.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Replay contract checks
        run: |
          python3 -B research/cspp/e4_v0_1/check_contract.py --self-test --output /tmp/cspp-checks.json
          diff -u research/cspp/e4_v0_1/CHECKS.json /tmp/cspp-checks.json
      - name: Reject premature freeze even under Python optimization
        run: |
          python3 - <<'PY'
          import json, subprocess, sys
          result = subprocess.run([sys.executable, '-O', '-B', 'research/cspp/e4_v0_1/check_contract.py', '--require-frozen'], capture_output=True, text=True)
          if result.returncode != 2 or json.loads(result.stdout)['status'] != 'BLOCKED_NOT_FROZEN':
              raise SystemExit('FAIL: draft freeze guard did not block')
          print('PASS: optimized Python cannot bypass the draft freeze guard')
          PY
      - run: python3 tests/python/verify_manifest.py
  scalar-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 -m pip install numpy==2.3.5 scipy==1.17.0
      - name: Verify package integrity and scientific HOLD
        run: python3 -O -B research/cspp/scalar_pilot_v0_1/verify_publication.py
      - name: Independent controls and replay of all 64 development runs
        run: python3 -B research/cspp/scalar_pilot_v0_1/audit.py --replay
      - name: Replay descriptive diagnostics
        run: |
          python3 -B research/cspp/scalar_pilot_v0_1/report.py --metrics-only
          git diff --exit-code -- research/cspp/scalar_pilot_v0_1/results/DIAGNOSTICS.json
  scale-calibration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 -m pip install numpy==2.3.5 scipy==1.17.0
      - name: Verify calibration package and unchanged science gates
        run: python3 -O -B research/cspp/scale_calibration_v0_2/verify_publication.py
      - name: Replay 48 clouds with explicit CPU-portability qualification
        run: python3 -B research/cspp/certified_budget_v0_3/portability_audit.py --output /tmp/cspp-portability-default.json
      - name: Replay without AVX-512 while preserving archive hashes and exact counts
        env:
          NPY_DISABLE_CPU_FEATURES: 'AVX512F,AVX512_SKX,AVX512_CLX,AVX512_CNL,AVX512_ICL'
        run: python3 -B research/cspp/certified_budget_v0_3/portability_audit.py --output /tmp/cspp-portability-baseline.json
      - name: Replay descriptive calibration diagnostics
        run: |
          python3 -B research/cspp/scale_calibration_v0_2/report.py --metrics-only
          git diff --exit-code -- research/cspp/scale_calibration_v0_2/results/DIAGNOSTICS.json
  certified-budget:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 -m pip install numpy==2.3.5 python-flint==0.8.0
      - name: Verify interval package, amendment and unchanged E4 HOLD
        run: python3 -O -B research/cspp/certified_budget_v0_3/verify_publication.py
      - name: Replay exact controls and all enclosures at higher precision
        run: python3 -B research/cspp/certified_budget_v0_3/audit.py --replay

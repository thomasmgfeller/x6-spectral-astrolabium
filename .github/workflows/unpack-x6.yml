name: Unpack X6 research repository
on:
  push:
    paths:
      - '.github/workflows/unpack-x6.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract existing X6 ZIP into repository root
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          archive=Path("X6_GitHub_Public_Research_Repository.zip")
          if not archive.is_file():
              raise SystemExit("ZIP archive not found")
          with zipfile.ZipFile(archive) as z:
              for item in z.infolist():
                  name=Path(item.filename)
                  if name.is_absolute() or ".." in name.parts:
                      raise SystemExit(f"Unsafe archive path: {item.filename}")
                  if item.is_dir():
                      continue
                  dest=Path.cwd()/name
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  dest.write_bytes(z.read(item))
          archive.unlink()
          PY
      - name: Commit extracted project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Publish unpacked X6 public research preview"
            git push
          fi

# Measurement series closed 2026-11-02. Pull requests only check stored data or test fixtures.
name: Hanford measurement archive
on:
  pull_request:
    paths:
      - 'agent/hanford*'
      - 'agent/source_transport.py'
      - 'app/causal-stability/hanford*'
      - 'app/causal-stability/hanford-data/**'
      - 'tests/python/test_hanford.py'
      - '.github/workflows/hanford-archive.yml'

permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r agent/hanford-requirements.txt
      - run: python -m unittest discover -s tests/python -p test_hanford.py -v

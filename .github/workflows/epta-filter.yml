# Measurement series closed 2026-11-02. Pull requests only check stored data or test fixtures.
name: EPTA timing and filter replay
on:
  pull_request:
    paths:
      - 'agent/epta*.py'
      - 'app/causal-stability/epta.mjs'
      - 'app/causal-stability/engine.mjs'
      - 'research/epta_filter_v1/**'
      - 'tests/python/test_epta.py'
      - '.github/workflows/epta-filter.yml'

permissions:
  contents: read
env:
  OPENBLAS_NUM_THREADS: '1'

jobs:
  test:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          sparse-checkout: |
            agent
            app/causal-stability
            research/epta_filter_v1
            tests/python
      - run: |
          python3.12 -m venv "$RUNNER_TEMP/py"
          "$RUNNER_TEMP/py/bin/pip" install --no-cache-dir --only-binary=:all: numpy==2.3.5
          "$RUNNER_TEMP/py/bin/python" -m unittest discover -s tests/python -p test_epta.py -v
          node --check app/causal-stability/epta.mjs

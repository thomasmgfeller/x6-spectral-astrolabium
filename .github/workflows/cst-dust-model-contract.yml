name: CST-DUST Model Contract
on:
  pull_request:
    paths:
      - 'research/rax_cqg/dust_collapse/model_contract_v0_1/**'
      - 'research/rax_cqg/dust_collapse/reports/CST_DUST_Model_Contract_v0_1.pdf'
      - 'research/rax_cqg/dust_collapse/packages/CST_DUST_Model_Contract_v0_1_Pruefpaket.zip'
      - '.github/workflows/cst-dust-model-contract.yml'
  push:
    branches: [main]
    paths:
      - 'research/rax_cqg/dust_collapse/model_contract_v0_1/**'
      - 'research/rax_cqg/dust_collapse/reports/CST_DUST_Model_Contract_v0_1.pdf'
      - 'research/rax_cqg/dust_collapse/packages/CST_DUST_Model_Contract_v0_1_Pruefpaket.zip'
      - '.github/workflows/cst-dust-model-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protocol-and-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check source artifacts, decision independence and reference replay
        run: python3 research/rax_cqg/dust_collapse/model_contract_v0_1/publication_check.py --replay

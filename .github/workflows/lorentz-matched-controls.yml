name: Lorentz Density and Height Matched Controls
on:
  pull_request:
    paths: ['research/lorentz_matched_controls/**', 'research/lorentz_matching_geometry/core.py', 'research/lorentz_matching_geometry/geometry.py', '.github/workflows/lorentz-matched-controls.yml']
  push:
    branches: [main]
    paths: ['research/lorentz_matched_controls/**', 'research/lorentz_matching_geometry/core.py', 'research/lorentz_matching_geometry/geometry.py', '.github/workflows/lorentz-matched-controls.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned numerical dependency
        run: python3 -m pip install -r research/lorentz_matched_controls/requirements.txt
      - name: Reproduce source-bound candidate pools and matched comparisons without network
        run: |
          OPENBLAS_NUM_THREADS=1 python3 -B -O research/lorentz_matched_controls/run.py --selftest
          sudo env "PATH=$PATH" GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory "GIT_CONFIG_VALUE_0=$GITHUB_WORKSPACE" \
            OPENBLAS_NUM_THREADS=1 unshare --net python3 -B -O research/lorentz_matched_controls/run.py \
            --run "$RUNNER_TEMP/matched-controls" --source-ref ef182efc4af8551295a754df32c2875f44b84574
      - name: Compare every declared exact output and numerical array
        run: |
          python3 research/lorentz_matched_controls/compare.py \
            research/lorentz_matched_controls/results "$RUNNER_TEMP/matched-controls"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: density-height-matched-controls-reproduction
          path: ${{ runner.temp }}/matched-controls
          if-no-files-found: error
          retention-days: 30

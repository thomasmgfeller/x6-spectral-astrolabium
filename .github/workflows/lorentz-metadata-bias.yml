name: Lorentz Metadata Bias Transfer
on:
  pull_request:
    paths: ['research/lorentz_local_dalembert/metadata_bias/**', '.github/workflows/lorentz-metadata-bias.yml']
  push:
    branches: [main]
    paths: ['research/lorentz_local_dalembert/metadata_bias/**', '.github/workflows/lorentz-metadata-bias.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controls-and-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r research/lorentz_bd_reference/requirements-replay.txt
      - name: Structural controls
        run: python3 -B research/lorentz_local_dalembert/metadata_bias/test_controls.py
      - name: Numerical replay when evidence is present
        if: ${{ hashFiles('research/lorentz_local_dalembert/metadata_bias/test_clouds.zip') != '' }}
        run: python3 -B research/lorentz_local_dalembert/metadata_bias/resume_evidence.py --verify
      - name: Source inventory
        run: python3 tests/python/verify_manifest.py

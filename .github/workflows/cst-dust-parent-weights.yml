name: CST-DUST parent-weight extension stability
on:
  pull_request:
    paths:
      - 'research/rax_cqg/dust_collapse/extension_stability_v0_2/**'
      - 'research/rax_cqg/dust_collapse/extension_stability_v0_2_publication.sha256'
      - 'research/rax_cqg/dust_collapse/reports/CST_DUST_Elterngewichte_Erweiterungsstabilitaet_v0_2.pdf'
      - 'research/rax_cqg/dust_collapse/packages/CST_DUST_Elterngewichte_Erweiterungsstabilitaet_v0_2_Pruefpaket.zip'
      - '.github/workflows/cst-dust-parent-weights.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parent-weight-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
    defaults:
      run:
        working-directory: research/rax_cqg/dust_collapse
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify publication hashes and all archive entries
        run: |
          sha256sum -c extension_stability_v0_2_publication.sha256
          unzip -q packages/CST_DUST_Elterngewichte_Erweiterungsstabilitaet_v0_2_Pruefpaket.zip -d "$RUNNER_TEMP/parent-weights"
          diff -qr extension_stability_v0_2 "$RUNNER_TEMP/parent-weights"
      - name: Replay order counts, quadrature, weight tests and certificates
        run: |
          python -m pip install -r extension_stability_v0_2/reference/requirements.txt
          python -B "$RUNNER_TEMP/parent-weights/verify.py"

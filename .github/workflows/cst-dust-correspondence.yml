name: CST-DUST pre-singularity correspondence
on:
  pull_request:
    paths:
      - 'research/rax_cqg/dust_collapse/correspondence_v0_1/**'
      - 'research/rax_cqg/dust_collapse/model_contract_v0_1/**'
      - 'research/rax_cqg/dust_collapse/current_calibration_v0_1/**'
      - 'research/rax_cqg/dust_collapse/reports/CST_DUST_Korrespondenz_v0_1.pdf'
      - 'research/rax_cqg/dust_collapse/packages/CST_DUST_Korrespondenz_v0_1_Pruefpaket.zip'
      - '.github/workflows/cst-dust-correspondence.yml'
  push:
    branches: [main]
    paths:
      - 'research/rax_cqg/dust_collapse/correspondence_v0_1/**'
      - 'research/rax_cqg/dust_collapse/model_contract_v0_1/**'
      - 'research/rax_cqg/dust_collapse/current_calibration_v0_1/**'
      - 'research/rax_cqg/dust_collapse/reports/CST_DUST_Korrespondenz_v0_1.pdf'
      - 'research/rax_cqg/dust_collapse/packages/CST_DUST_Korrespondenz_v0_1_Pruefpaket.zip'
      - '.github/workflows/cst-dust-correspondence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  correspondence-reference-and-scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned numerical dependencies
        run: |
          python3 -m pip install --only-binary=:all: -r research/rax_cqg/dust_collapse/correspondence_v0_1/requirements.txt
      - name: Check original artifacts, physical HOLD and separate regularity
        run: python3 -O -B research/rax_cqg/dust_collapse/correspondence_v0_1/publication_check.py
      - name: Replay all reference and budget results in isolation
        run: python3 -B research/rax_cqg/dust_collapse/correspondence_v0_1/publication_check.py --replay

name: Eigenzeit reference audit v0.11
on:
  pull_request:
    paths:
      - 'research/eigenzeit/reference_audit_v0_11/**'
      - 'research/eigenzeit/drift_reserve_v0_10/Eigenzeit_Driftreserve_v0_10_Pruefpaket.zip'
      - '.github/workflows/eigenzeit-reference-audit.yml'
      - 'tools/workflow/requirements-research.txt'
  push:
    branches: [main]
    paths:
      - 'research/eigenzeit/reference_audit_v0_11/**'
      - 'research/eigenzeit/drift_reserve_v0_10/Eigenzeit_Driftreserve_v0_10_Pruefpaket.zip'
      - '.github/workflows/eigenzeit-reference-audit.yml'
      - 'tools/workflow/requirements-research.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/workflow/requirements-research.txt
      - name: Verify original artifacts and reproduce the audit, pilot and controls
        run: python -B research/eigenzeit/reference_audit_v0_11/publication_check.py --replay

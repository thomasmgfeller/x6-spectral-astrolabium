name: H7 Structural Explanation
on:
  pull_request:
    paths: ['research/lorentz_h7_structure/**', '.github/workflows/h7-structure.yml']
  push:
    branches: [main]
    paths: ['research/lorentz_h7_structure/**', '.github/workflows/h7-structure.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-structure-certificates:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Reproduce exact structural results without network
        run: >-
          sudo env "PATH=$PATH" unshare --net
          python3 -B -O research/lorentz_h7_structure/analyze.py
          --output "$RUNNER_TEMP/h7-structure.json"
      - run: cmp research/lorentz_h7_structure/results.json "$RUNNER_TEMP/h7-structure.json"
      - name: Verify certificates and rejection controls without network
        run: >-
          sudo env "PATH=$PATH" GIT_CONFIG_COUNT=1
          GIT_CONFIG_KEY_0=safe.directory "GIT_CONFIG_VALUE_0=$GITHUB_WORKSPACE"
          unshare --net python3 -B -O research/lorentz_h7_structure/verify.py
          "$RUNNER_TEMP/h7-structure.json" > "$RUNNER_TEMP/h7-structure-verification.json"
      - run: cmp research/lorentz_h7_structure/verification.json "$RUNNER_TEMP/h7-structure-verification.json"
      - name: Reproduce exact Hasse diagram
        run: |
          python3 research/lorentz_h7_structure/draw.py --output "$RUNNER_TEMP/h7-counterexample.svg"
          cmp research/lorentz_h7_structure/counterexample.svg "$RUNNER_TEMP/h7-counterexample.svg"

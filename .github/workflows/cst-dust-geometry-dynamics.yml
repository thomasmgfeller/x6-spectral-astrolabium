name: CST-DUST stationary geometry candidate
on:
  pull_request:
    paths:
      - 'research/rax_cqg/dust_collapse/geometry_dynamics_v0_1/**'
      - 'research/rax_cqg/dust_collapse/geometry_dynamics_publication.json'
      - 'research/rax_cqg/dust_collapse/verify_geometry_dynamics_publication.py'
      - 'research/rax_cqg/dust_collapse/reports/CST_DUST_Geometriedynamik_Stationaerer_Kandidat_v0_1.pdf'
      - 'research/rax_cqg/dust_collapse/packages/CST_DUST_Geometriedynamik_Stationaerer_Kandidat_v0_1_Pruefpaket.zip'
      - '.github/workflows/cst-dust-geometry-dynamics.yml'
  push:
    branches: [main]
    paths:
      - 'research/rax_cqg/dust_collapse/geometry_dynamics_v0_1/**'
      - 'research/rax_cqg/dust_collapse/geometry_dynamics_publication.json'
      - 'research/rax_cqg/dust_collapse/verify_geometry_dynamics_publication.py'
      - 'research/rax_cqg/dust_collapse/reports/CST_DUST_Geometriedynamik_Stationaerer_Kandidat_v0_1.pdf'
      - 'research/rax_cqg/dust_collapse/packages/CST_DUST_Geometriedynamik_Stationaerer_Kandidat_v0_1_Pruefpaket.zip'
      - '.github/workflows/cst-dust-geometry-dynamics.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stationary-geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned symbolic algebra
        run: python -m pip install -r research/rax_cqg/dust_collapse/geometry_dynamics_v0_1/requirements.txt
      - name: Check original artifacts and replay nine finite programs in isolation
        run: python -B research/rax_cqg/dust_collapse/verify_geometry_dynamics_publication.py

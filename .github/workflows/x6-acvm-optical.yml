name: ACVM 0.2 optical reference
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'experimental/acvm/**'
      - 'experimental/control_channel/**'
      - 'tests/acvm/**'
      - 'tests/control-channel/**'
      - 'tools/workflow/cli.py'
      - 'docs/acvm/optical-v0.2/**'
      - 'ACVM_OPTICAL_SOURCE_MANIFEST.json'
      - '.github/workflows/x6-acvm-optical.yml'
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 tests/acvm/qualify_checkout.py --output /tmp/acvm-checkout-evidence
      - name: Preserve software evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acvm-v02-software-evidence
          path: /tmp/acvm-checkout-evidence/
          retention-days: 30

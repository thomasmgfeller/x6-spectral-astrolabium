name: X6 Integrated Local Workflow
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'x6.py'
      - 'tools/workflow/**'
      - 'tests/integration/**'
      - 'docs/INTEGRATION.md'
      - 'INTEGRATION_SOURCE_MANIFEST.json'
      - '.github/workflows/x6-integration.yml'
permissions:
  contents: read
jobs:
  fresh-checkout:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser qualification tools
        run: |
          npm install --prefix "$RUNNER_TEMP/x6-browser" --no-save --no-package-lock --no-audit --no-fund playwright@1.62.1
          node "$RUNNER_TEMP/x6-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Execute documented workflow from fresh checkout
        env:
          NODE_PATH: ${{ runner.temp }}/x6-browser/node_modules
        run: python tests/integration/qualify_checkout.py --with-browser --output "$RUNNER_TEMP/x6-integration-evidence"
      - name: Preserve exact qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x6-integration-evidence
          path: ${{ runner.temp }}/x6-integration-evidence/
          retention-days: 30
          if-no-files-found: warn

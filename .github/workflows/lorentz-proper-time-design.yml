name: Lorentz Proper Time Design
on:
  pull_request:
    paths: ['research/lorentz_proper_time/**', '.github/workflows/lorentz-proper-time-design.yml']
  push:
    branches: [main]
    paths: ['research/lorentz_proper_time/**', '.github/workflows/lorentz-proper-time-design.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-design:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Exact deterministic examples only, without target generation
        run: python3 -B -O research/lorentz_proper_time/check_design.py
      - name: Source inventory and research navigation
        run: |
          python3 tests/python/verify_manifest.py
          python3 tools/module_registry.py --check --git-objects
          python3 tools/build_hub.py --check
          python3 tools/check_hub.py

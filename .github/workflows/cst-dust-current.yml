name: CST-DUST Current Calibration
on:
  pull_request:
    paths:
      - 'research/rax_cqg/dust_collapse/current_calibration_v0_1/**'
      - 'research/rax_cqg/dust_collapse/model_contract_v0_1/contract.json'
      - 'research/rax_cqg/dust_collapse/model_contract_v0_1/gate.py'
      - 'research/rax_cqg/dust_collapse/reports/CST_DUST_Staubstrom_Kalibrierung_v0_1.pdf'
      - 'research/rax_cqg/dust_collapse/packages/CST_DUST_Staubstrom_Kalibrierung_v0_1_Pruefpaket.zip'
      - '.github/workflows/cst-dust-current.yml'
  push:
    branches: [main]
    paths:
      - 'research/rax_cqg/dust_collapse/current_calibration_v0_1/**'
      - 'research/rax_cqg/dust_collapse/model_contract_v0_1/contract.json'
      - 'research/rax_cqg/dust_collapse/model_contract_v0_1/gate.py'
      - 'research/rax_cqg/dust_collapse/reports/CST_DUST_Staubstrom_Kalibrierung_v0_1.pdf'
      - 'research/rax_cqg/dust_collapse/packages/CST_DUST_Staubstrom_Kalibrierung_v0_1_Pruefpaket.zip'
      - '.github/workflows/cst-dust-current.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  current-reference-and-scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned numerical dependencies
        run: python3 -m pip install --only-binary=:all: -r research/rax_cqg/dust_collapse/current_calibration_v0_1/publication-requirements.txt
      - name: Check source artifacts and independent scientific decisions
        run: python3 -O -B research/rax_cqg/dust_collapse/current_calibration_v0_1/publication_check.py
      - name: Replay finite reference and all result tables in isolation
        run: python3 -B research/rax_cqg/dust_collapse/current_calibration_v0_1/publication_check.py --replay

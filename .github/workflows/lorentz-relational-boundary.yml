name: Lorentz Relational Information Boundary
on:
  pull_request:
    paths: ['research/lorentz_relational_boundary/**', '.github/workflows/lorentz-relational-boundary.yml', 'research/lorentz_observable_comparison/*.py', 'research/lorentz_residual_diagnosis/*.py', 'research/lorentz_n1_stress/*.py']
  push:
    branches: [main]
    paths: ['research/lorentz_relational_boundary/**', '.github/workflows/lorentz-relational-boundary.yml', 'research/lorentz_observable_comparison/*.py', 'research/lorentz_residual_diagnosis/*.py', 'research/lorentz_n1_stress/*.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-relational-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Reproduce source-bound information-boundary study without network
        run: |
          python3 -B -O research/lorentz_relational_boundary/run.py --selftest
          sudo env "PATH=$PATH" GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory "GIT_CONFIG_VALUE_0=$GITHUB_WORKSPACE" \
            unshare --net python3 -B -O research/lorentz_relational_boundary/run.py \
            --run "$RUNNER_TEMP/relational-boundary" --source-ref 99ecd6271b9664beadbb38117c641d5c3fcb779f
      - name: Compare every deterministic result
        run: |
          for name in inputs.json records.json.gz indexed.json.gz reconstruction.json.gz rounds.json.gz reference.json.gz summary.json.gz summary_counts.json controls.json costs.json verification.json produce.log check.log; do
            cmp "research/lorentz_relational_boundary/results/$name" "$RUNNER_TEMP/relational-boundary/$name"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relational-boundary-reproduction
          path: ${{ runner.temp }}/relational-boundary*
          if-no-files-found: error
          retention-days: 30

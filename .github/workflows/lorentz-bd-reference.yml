name: Lorentz BD Poisson Reference
on:
  pull_request:
    paths: ['research/lorentz_bd_reference/**', 'research/lorentz_local_dalembert/**', '.github/workflows/lorentz-bd-reference.yml']
  push:
    branches: [main]
    paths: ['research/lorentz_bd_reference/**', 'research/lorentz_local_dalembert/**', '.github/workflows/lorentz-bd-reference.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  continuous-paired-supports:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r research/lorentz_local_dalembert/finite_poisson_bounds/requirements.txt
      - run: python3 -B research/lorentz_local_dalembert/paired_continuous/pc_run.py --verify
      - run: python3 -B research/lorentz_local_dalembert/paired_continuous/pc_audit.py --verify
      - run: python3 -B research/lorentz_local_dalembert/paired_continuous/pc_overlap.py --verify
      - run: python3 -B research/lorentz_local_dalembert/paired_continuous/pc_overlap_audit.py --verify
      - run: sha256sum -c research/lorentz_local_dalembert/paired_continuous/SHA256SUMS
      - run: python3 tests/python/verify_manifest.py

  coordinated-support-motions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

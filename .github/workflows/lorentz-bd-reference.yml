name: Lorentz BD Poisson Reference
on:
  pull_request:
    paths: ['research/lorentz_bd_reference/**', 'research/lorentz_local_dalembert/**', '.github/workflows/lorentz-bd-reference.yml']
  push:
    branches: [main]
    paths: ['research/lorentz_bd_reference/**', 'research/lorentz_local_dalembert/**', '.github/workflows/lorentz-bd-reference.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  eligibility-before-cap-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r research/lorentz_local_dalembert/eligibility_before_cap/requirements.txt
      - run: python3 -B research/lorentz_local_dalembert/eligibility_before_cap/ci_check.py
      - run: python3 tests/python/verify_manifest.py

  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r research/lorentz_bd_reference/requirements-replay.txt
      - run: python3 -B research/lorentz_bd_reference/replay_portable.py
      - run: python3 -B research/lorentz_local_dalembert/preflight.py
      - run: python3 -B research/lorentz_local_dalembert/phase12/verify.py
      - run: python3 -B research/lorentz_local_dalembert/anchor_audit/verify_audit.py
      - run: python3 -B research/lorentz_local_dalembert/moment_audit/verify_moments.py
      - run: python3 tests/python/verify_manifest.py

  volume-shell-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6

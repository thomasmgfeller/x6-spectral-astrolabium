      - run: python3 -B research/lorentz_local_dalembert/coordinated_motions/cm_audit.py --verify
      - run: python3 -B research/lorentz_local_dalembert/coordinated_motions/cm_joint.py --verify
      - run: python3 -B research/lorentz_local_dalembert/coordinated_motions/cm_joint_audit.py --verify
      - run: sha256sum -c research/lorentz_local_dalembert/coordinated_motions/SHA256SUMS

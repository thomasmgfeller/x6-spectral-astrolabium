name: Eigenzeit single-order power v0.2
on:
  pull_request:
    paths:
      - 'research/eigenzeit/single_order_power_v0_2/**'
      - '.github/workflows/eigenzeit-single-order-power.yml'
      - 'tools/workflow/requirements-research.txt'
  push:
    branches: [main]
    paths:
      - 'research/eigenzeit/single_order_power_v0_2/**'
      - '.github/workflows/eigenzeit-single-order-power.yml'
      - 'tools/workflow/requirements-research.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned research dependencies
        run: python -m pip install -r tools/workflow/requirements-research.txt
      - name: Verify original files and replay certificate, audit and four examples
        run: python -B research/eigenzeit/single_order_power_v0_2/publication_check.py --replay

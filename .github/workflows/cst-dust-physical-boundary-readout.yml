name: CST-DUST physical boundary and readout contract
on:
  pull_request:
    paths:
      - 'research/rax_cqg/dust_collapse/physical_boundary_readout_v0_1/**'
      - 'research/rax_cqg/dust_collapse/physical_boundary_readout_publication.json'
      - 'research/rax_cqg/dust_collapse/verify_physical_boundary_readout_publication.py'
      - 'research/rax_cqg/dust_collapse/reports/CST_DUST_Physikalischer_Rand_Auslesevertrag_v0_1.pdf'
      - 'research/rax_cqg/dust_collapse/packages/CST_DUST_Physikalischer_Rand_Auslesevertrag_v0_1_Pruefpaket.zip'
      - '.github/workflows/cst-dust-physical-boundary-readout.yml'
  push:
    branches: [main]
    paths:
      - 'research/rax_cqg/dust_collapse/physical_boundary_readout_v0_1/**'
      - 'research/rax_cqg/dust_collapse/physical_boundary_readout_publication.json'
      - 'research/rax_cqg/dust_collapse/verify_physical_boundary_readout_publication.py'
      - 'research/rax_cqg/dust_collapse/reports/CST_DUST_Physikalischer_Rand_Auslesevertrag_v0_1.pdf'
      - 'research/rax_cqg/dust_collapse/packages/CST_DUST_Physikalischer_Rand_Auslesevertrag_v0_1_Pruefpaket.zip'
      - '.github/workflows/cst-dust-physical-boundary-readout.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  physical-boundary-readout:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned finite-replay dependencies
        run: python -m pip install -r research/rax_cqg/dust_collapse/physical_boundary_readout_v0_1/requirements.txt
      - name: Verify original artifacts and replay ten programs in isolation
        run: python -B research/rax_cqg/dust_collapse/verify_physical_boundary_readout_publication.py

name: X6 Source Agents

on:
  schedule:
    - cron: '37 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'agent/**'
      - 'app/**'
      - 'tests/python/test_source_agents.py'
      - '.github/workflows/x6-source-agents.yml'
  pull_request:
    paths:
      - 'agent/**'
      - 'app/**'
      - 'tests/python/test_source_agents.py'
      - '.github/workflows/x6-source-agents.yml'

permissions:
  contents: read

concurrency:
  group: x6-source-agents-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-agent:
    name: Agent / ${{ matrix.source }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        source: [atlas, qutech, nasa]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install fixed scientific and browser dependencies
        run: |
          python -m pip install -r agent/source-requirements.txt
          python -m playwright install --with-deps chromium --only-shell
          python -c 'import libarchive, h5py, networkx, numpy'
      - name: Restore small verified NASA subset
        if: matrix.source == 'nasa'
        uses: actions/cache@v4
        with:
          path: .agent-cache/nasa-ims-subset-v1
          key: x6-nasa-ims-subset-v1-${{ hashFiles('agent/measurement_sources.py') }}
      - name: Test rejection gates and source adapters
        run: python -m unittest tests/python/test_data_agent.py tests/python/test_source_agents.py -v
      - name: Run source against actual X6 application
        run: python -u agent/run_sources.py --source '${{ matrix.source }}' --output source-agent-output
      - name: Publish run summary
        if: always()
        run: |
          if [ -f source-agent-output/summary.md ]; then
            cat source-agent-output/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'NOT_EXECUTED: inspect setup/test logs. No successful source run is claimed.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload original subset and evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x6-${{ matrix.source }}-agent-${{ github.run_id }}-${{ github.run_attempt }}
          path: source-agent-output/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 9

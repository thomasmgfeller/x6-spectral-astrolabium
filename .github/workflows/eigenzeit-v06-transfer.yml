name: Assemble verified Eigenzeit v0.6 archive
on:
  push:
    branches: [research/eigenzeit-relative-calibration-v0-6]
    paths: ['.github/workflows/eigenzeit-v06-transfer.yml', '.publication-transfer/**']
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify two fixed blobs and store the original archive
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, hashlib, json, os, urllib.request
          url = 'https://api.github.com/repos/thomasmgfeller/x6-spectral-astrolabium/git/blobs'
          headers = {'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'], 'Accept': 'application/vnd.github+json', 'User-Agent': 'x6-archive-publication'}
          parts = []
          for sha in ['57b920e5ee31b0bb76c959d3d6c309decb7d90d1', '4a56bb18d365e48f89a0567d337ce5336a4f73d5']:
              req = urllib.request.Request(url + '/' + sha, headers=headers)
              with urllib.request.urlopen(req, timeout=40) as response:
                  blob = json.load(response)
              if blob['sha'] != sha or blob['encoding'] != 'base64':
                  raise ValueError('unexpected source blob')
              parts.append(base64.b64decode(blob['content']))
          data = b''.join(parts)
          if len(data) != 17949828 or hashlib.sha256(data).hexdigest() != 'fbada3c70e7b6428d6bd4e1b394b170b7b5463cc123f4abd6f97408fd773c37b':
              raise ValueError('assembled archive differs from the verified original')
          body = json.dumps({'encoding': 'base64', 'content': base64.b64encode(data).decode('ascii')}).encode()
          req = urllib.request.Request(url, data=body, headers={**headers, 'Content-Type': 'application/json'})
          with urllib.request.urlopen(req, timeout=90) as response:
              result = json.load(response)
          if result['sha'] != 'a6f0b7c00e8571c59f6c81f70f3c420af0c28993':
              raise ValueError('stored archive differs')
          print('Verified original archive', result['sha'])

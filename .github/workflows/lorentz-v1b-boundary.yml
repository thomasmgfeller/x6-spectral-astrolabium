name: V1b Boundary and Browser Evidence
on:
  pull_request:
    paths: ['research/lorentz_proper_time_lab/**', 'app/proper-time.html', '.github/workflows/lorentz-v1b-boundary.yml']
  push:
    branches: [main]
    paths: ['research/lorentz_proper_time_lab/**', 'app/proper-time.html', '.github/workflows/lorentz-v1b-boundary.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  engineering-and-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        timeout-minutes: 3
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          python -m pip install -r research/lorentz_proper_time_lab/v1b_boundary/requirements.txt
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Freeze native and actual browser download evidence
        run: |
          python research/lorentz_proper_time_lab/build.py --check
          node research/lorentz_proper_time_lab/v1b_boundary/native.cjs "$RUNNER_TEMP/v1b-boundary"
          node research/lorentz_proper_time_lab/v1b_boundary/browser.cjs "$RUNNER_TEMP/v1b-boundary"
          python research/lorentz_proper_time_lab/v1b_boundary/analyze.py "$RUNNER_TEMP/v1b-boundary"
          python tests/python/verify_manifest.py
      - name: Publish qualification status separately from engineering CI
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'v1b-boundary/qualification.json'
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              if p.exists():
                  r=json.loads(p.read_text())
                  f.write('V1b overall: **'+r['overall_V1b']+'**\n\nEngineering: '+r['engineering_status']+'\n\n')
                  f.write('A green job verifies engineering and evidence production; it does not imply overall V1b PASS.\n\n')
                  for k,v in r['gates'].items(): f.write('- '+k+': '+v+'\n')
              else: f.write('V1b evidence incomplete; no qualification granted.\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v1b-boundary-browser-evidence
          path: ${{ runner.temp }}/v1b-boundary
          retention-days: 90

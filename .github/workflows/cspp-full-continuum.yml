name: CSPP full scalar continuum reference
on:
  pull_request:
    paths: ['research/cspp/full_continuum_v0_12/**', '.github/workflows/cspp-full-continuum.yml']
  push:
    branches: [main]
    paths: ['research/cspp/full_continuum_v0_12/**', '.github/workflows/cspp-full-continuum.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-detector-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r research/cspp/full_continuum_v0_12/requirements.txt
      - name: Audit archived full reference and analytical controls
        run: python3 -B research/cspp/full_continuum_v0_12/verify.py
      - name: Reproduce both precisions and compare exact targets
        working-directory: research/cspp/full_continuum_v0_12
        run: |
          cp results/BENCHMARK_128.json.gz /tmp/full-continuum-original-128.json.gz
          cp results/BENCHMARK_192.json.gz /tmp/full-continuum-original-192.json.gz
          python3 -B run.py --bits 128 --out results/BENCHMARK_128.json.gz
          python3 -B run.py --bits 192 --out results/BENCHMARK_192.json.gz
          python3 -B verify.py
          python3 - <<'PY'
          from flint import ctx,arb
          from run import gzread,unpack
          from pathlib import Path
          ctx.prec=256
          for bits in [128,192]:
              before=gzread(Path(f'/tmp/full-continuum-original-{bits}.json.gz'))
              after=gzread(Path(f'results/BENCHMARK_{bits}.json.gz'))
              assert before['overall_status']==after['overall_status']
              for a,b in zip(before['reference']['windows'],after['reference']['windows']):
                  assert unpack(a['normalized_value']).overlaps(unpack(b['normalized_value']))
                  assert unpack(a['physical_value']).overlaps(unpack(b['physical_value']))
              for a,b in zip(before['rows'],after['rows']):
                  assert a['coordinates_sha256']==b['coordinates_sha256']
                  assert a['counts_sha256']==b['counts_sha256']
                  assert all(unpack(x).overlaps(unpack(y)) for x,y in zip(a['oracle_history'],b['oracle_history']))
                  for u,v in zip(a['windows'],b['windows']):
                      for x,y in zip(u['models'],v['models']):
                          assert x['dominant_component']==y['dominant_component']
                          for k in ['solution_budget_pass','total_accuracy_pass','history_budget_pass']:
                              assert x[k]==y[k]
                          for k in ['ideal_adapter_response','continuum_oracle_discrete_response']:
                              assert unpack(x[k]).overlaps(unpack(y[k]))
                          for k in ['adapter','operator_domain']:
                              assert unpack(x['components'][k]['value']).overlaps(unpack(y['components'][k]['value']))
                          # Different BLAS reductions can change the declared binary64
                          # representative. They are not the same exact target.
                          assert (unpack(x['numeric_response'])-unpack(y['numeric_response'])).abs_upper()<arb('1e-14')
          print('PASS: replayed continuum, oracle, ideal targets and attribution decisions')
          PY

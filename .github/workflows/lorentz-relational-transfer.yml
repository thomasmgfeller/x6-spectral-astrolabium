name: Lorentz Relational Transfer
on:
  pull_request:
    paths: ['research/lorentz_relational_transfer/**', '.github/workflows/lorentz-relational-transfer.yml', 'research/lorentz_observable_comparison/*.py', 'research/lorentz_residual_diagnosis/*.py', 'research/lorentz_n1_stress/*.py']
  push:
    branches: [main]
    paths: ['research/lorentz_relational_transfer/**', '.github/workflows/lorentz-relational-transfer.yml', 'research/lorentz_observable_comparison/*.py', 'research/lorentz_residual_diagnosis/*.py', 'research/lorentz_n1_stress/*.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-relational-transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Reproduce source-bound fixed inputs and checks without network
        run: |
          python3 -B -O research/lorentz_relational_transfer/run.py --selftest
          sudo env "PATH=$PATH" GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory "GIT_CONFIG_VALUE_0=$GITHUB_WORKSPACE" \
            unshare --net python3 -B -O research/lorentz_relational_transfer/run.py \
            --run "$RUNNER_TEMP/relational-transfer" --source-ref b4f2eaca554574c25a16ee84f8aeb1795a821ec3
      - name: Compare every deterministic result
        run: |
          for name in inputs.json records.jsonl.gz rounds.json.gz reference.json certificate.json summary.json costs.json verification.json; do
            cmp "research/lorentz_relational_transfer/results/$name" "$RUNNER_TEMP/relational-transfer/$name"
          done
      - name: Recheck separately labelled algebraic interpretation
        run: |
          # The isolated run is root-owned. Copy its checked outputs into a
          # runner-owned directory before the supplemental receipt is written.
          cp -R "$RUNNER_TEMP/relational-transfer" "$RUNNER_TEMP/relational-transfer-explanation"
          python3 -B -O research/lorentz_relational_transfer/explain.py "$RUNNER_TEMP/relational-transfer-explanation"
          cmp research/lorentz_relational_transfer/results/explanation.json "$RUNNER_TEMP/relational-transfer-explanation/explanation.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relational-transfer-reproduction
          path: ${{ runner.temp }}/relational-transfer*
          if-no-files-found: error
          retention-days: 30

name: V1b Radial Audit Evidence
on:
  pull_request:
    paths: ['research/lorentz_proper_time_lab/**', '.github/workflows/lorentz-v1b-radial.yml']
  push:
    branches: [main]
    paths: ['research/lorentz_proper_time_lab/**', '.github/workflows/lorentz-v1b-radial.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frozen-radial-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/lorentz_proper_time_lab/v1b_boundary/requirements.txt
      - name: Verify all archived radial data and frozen primary tests
        run: python research/lorentz_proper_time_lab/v1b_radial_audit/verify.py

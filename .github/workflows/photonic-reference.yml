name: Photonic Reference
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'experiments/photonic-two-qubit/**'
      - 'tests/photonics/**'
      - 'device/vendor/sagnac_v0_7/**'
      - 'SAGNAC_SOURCE_MANIFEST.json'
      - '.github/workflows/photonic-reference.yml'
permissions:
  contents: read
jobs:
  software-and-models:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned GHDL 5.0.1 without release inventory
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ARCH" = X64
          . /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_ID" = 24.04
          ghdl_install_dir="$RUNNER_TEMP/ghdl-5.0.1"
          ghdl_archive="$RUNNER_TEMP/ghdl-mcode-5.0.1-ubuntu24.04-x86_64.tar.gz"
          # Official v5.0.1 release asset 233696643, Ubuntu 24.04 / mcode.
          # Pin bytes as well as version; no mutable inventory.json dependency.
          ghdl_sha256=69ac3a830659c4feb3067b6279bc972d8e78f0fe9db2d77d112cceebc29afe64
          ghdl_url=https://github.com/ghdl/ghdl/releases/download/v5.0.1/ghdl-mcode-5.0.1-ubuntu24.04-x86_64.tar.gz
          if ! curl --fail --location --silent --show-error \
              --retry 4 --retry-delay 2 --retry-max-time 90 \
              --connect-timeout 15 --max-time 60 \
              "$ghdl_url" -o "$ghdl_archive"; then
            curl --fail --location --silent --show-error \
              --retry 4 --retry-delay 2 --retry-max-time 90 \
              --connect-timeout 15 --max-time 60 \
              -H 'Accept: application/octet-stream' \
              https://api.github.com/repos/ghdl/ghdl/releases/assets/233696643 \
              -o "$ghdl_archive"
          fi
          printf '%s  %s\n' "$ghdl_sha256" "$ghdl_archive" | sha256sum --check --strict
          mkdir -p "$ghdl_install_dir"
          tar -xzf "$ghdl_archive" -C "$ghdl_install_dir" --strip-components=1
          sudo apt-get install -y --no-install-recommends libgnat-13
          "$ghdl_install_dir/bin/ghdl" --version | tee "$RUNNER_TEMP/ghdl-version.txt"
          grep -Eq '^GHDL 5\.0\.1 ' "$RUNNER_TEMP/ghdl-version.txt"
          grep -qi 'mcode' "$RUNNER_TEMP/ghdl-version.txt"
          printf '%s\n' "$ghdl_install_dir/bin" >> "$GITHUB_PATH"
          printf 'GHDL_PREFIX=%s\n' "$ghdl_install_dir/lib/ghdl" >> "$GITHUB_ENV"
      - name: Install reference dependencies
        run: python -m pip install -r tests/photonics/requirements.txt
      - name: Locate packaged VHDL libraries
        run: |
          if [ -d "$GHDL_PREFIX/vhdl" ]; then
            echo "GHDL_PREFIX=$GHDL_PREFIX/vhdl" >> "$GITHUB_ENV"
          fi
      - name: Verify source inventory
        run: python tests/python/verify_manifest.py
      - name: Reproduce digital and mechanical reference checks
        run: |
          mkdir -p photonic-evidence
          git rev-parse HEAD > photonic-evidence/source-commit.txt
          python tests/photonics/validate_release.py --ghdl --cad --output photonic-evidence
      - name: Preserve fresh software and model evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photonic-reference-evidence
          path: photonic-evidence/
          retention-days: 7
          if-no-files-found: warn
  optikplan-statistics:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: experiments/photonic-two-qubit/optics/optikplan-v0.1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned statistical dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify original package and reproduce conditional statistics
        run: |
          mkdir -p "${{ github.workspace }}/optikplan-evidence"
          git rev-parse HEAD > "${{ github.workspace }}/optikplan-evidence/source-commit.txt"
          sha256sum -c SHA256SUMS.txt
          python -m unittest -v test_chsh_check
          python chsh_check.py counts_SYNTHETIC.csv --data-kind synthetic --output "${{ github.workspace }}/optikplan-evidence/synthetic_result.json"
          cmp synthetic_result.json "${{ github.workspace }}/optikplan-evidence/synthetic_result.json"
      - name: Preserve fresh synthetic statistical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optikplan-statistics-evidence
          path: optikplan-evidence/
          retention-days: 7
          if-no-files-found: warn

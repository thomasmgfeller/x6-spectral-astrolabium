name: Eigenzeit two-look calibration v0.7
on:
  pull_request:
    paths:
      - 'research/eigenzeit/two_look_calibration_v0_7/**'
      - 'research/eigenzeit/relative_calibration_v0_6/Eigenzeit_Relative_Kalibrierung_v0_6_Pruefpaket.zip'
      - '.github/workflows/eigenzeit-two-look-calibration.yml'
      - 'tools/workflow/requirements-research.txt'
  push:
    branches: [main]
    paths:
      - 'research/eigenzeit/two_look_calibration_v0_7/**'
      - 'research/eigenzeit/relative_calibration_v0_6/Eigenzeit_Relative_Kalibrierung_v0_6_Pruefpaket.zip'
      - '.github/workflows/eigenzeit-two-look-calibration.yml'
      - 'tools/workflow/requirements-research.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/workflow/requirements-research.txt
      - name: Verify provenance, recompute two-look bounds and replay the stopped pilot
        run: python -B research/eigenzeit/two_look_calibration_v0_7/publication_check.py --replay

name: CST-DUST quantum structure and scoped metric obstruction
on:
  pull_request:
    paths:
      - 'research/rax_cqg/dust_collapse/quantum_structure_v0_1/**'
      - 'research/rax_cqg/dust_collapse/model_contract_v0_1/**'
      - 'research/rax_cqg/dust_collapse/variation_v0_1/**'
      - 'research/rax_cqg/dust_collapse/gluing_v0_1/**'
      - 'research/rax_cqg/dust_collapse/reports/CST_DUST_Zustandsraum_Constraints_v0_1.pdf'
      - 'research/rax_cqg/dust_collapse/packages/CST_DUST_Zustandsraum_Constraints_v0_1_Pruefpaket.zip'
      - '.github/workflows/cst-dust-quantum-structure.yml'
  push:
    branches: [main]
    paths:
      - 'research/rax_cqg/dust_collapse/quantum_structure_v0_1/**'
      - 'research/rax_cqg/dust_collapse/model_contract_v0_1/**'
      - 'research/rax_cqg/dust_collapse/variation_v0_1/**'
      - 'research/rax_cqg/dust_collapse/gluing_v0_1/**'
      - 'research/rax_cqg/dust_collapse/reports/CST_DUST_Zustandsraum_Constraints_v0_1.pdf'
      - 'research/rax_cqg/dust_collapse/packages/CST_DUST_Zustandsraum_Constraints_v0_1_Pruefpaket.zip'
      - '.github/workflows/cst-dust-quantum-structure.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quantum-structure-and-scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check original artifacts and independent physical decisions
        run: python3 -O -B research/rax_cqg/dust_collapse/quantum_structure_v0_1/publication_check.py
      - name: Replay label reduction, metric obstruction and constraint reference
        run: python3 -O -B research/rax_cqg/dust_collapse/quantum_structure_v0_1/publication_check.py --replay

name: X6 Validation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/**'
      - 'tests/**'
      - 'data/**'
      - 'device/**'
      - 'docs/SAGNAC_INTEGRATION.md'
      - 'SAGNAC_SOURCE_MANIFEST.json'
      - 'SHA256_REPOSITORY.json'
      - '.github/workflows/x6-validation.yml'
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Integrity and rational checks
        run: |
          python tests/python/verify_manifest.py
          python tests/python/static_ui_preflight.py
          python tests/python/independent_audit.py
          python -m unittest discover -s tests/python -p 'test_validation_runner.py' -v
  julia:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - name: Numerical eigenvalue reference
        run: julia tests/julia/reference.jl
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
      - name: X6 HTTP qualification smoke
        env:
          X6_EVIDENCE_DIR: x6-evidence
        run: python tests/browser/browser_http_test.py
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x6-browser-evidence
          path: x6-evidence/
          if-no-files-found: warn
  sagnac:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Sagnac browser test dependency
        run: |
          npm install --prefix "$RUNNER_TEMP/x6-sagnac" --no-save --no-package-lock --no-audit --no-fund playwright@1.62.1
          node "$RUNNER_TEMP/x6-sagnac/node_modules/playwright/cli.js" install --with-deps chromium
          mkdir -p sagnac-evidence
          git rev-parse HEAD > sagnac-evidence/source-commit.txt
      - name: Strict raw-frame and Python-reference checks
        run: node tests/sagnac/test_core.cjs > sagnac-evidence/core.json
      - name: Loopback and simulated serial tests
        run: python -m unittest discover -s tests/sagnac -p 'test_*.py' -v > sagnac-evidence/bridge.log 2>&1
      - name: Sagnac Chromium, export, language, mobile and offline tests
        env:
          NODE_PATH: ${{ runner.temp }}/x6-sagnac/node_modules
        run: node tests/sagnac/browser_test.cjs > sagnac-evidence/browser.json 2> sagnac-evidence/browser.stderr.log
      - name: Preserve Sagnac software evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x6-sagnac-evidence
          path: sagnac-evidence/
          retention-days: 7
          if-no-files-found: warn

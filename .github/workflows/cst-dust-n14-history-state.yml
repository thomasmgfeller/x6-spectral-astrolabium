name: CST-DUST N14 history measure and state space
on:
  pull_request:
    paths:
      - 'research/rax_cqg/dust_collapse/history_measure_state_space_v0_1/**'
      - 'research/rax_cqg/dust_collapse/history_measure_state_space_v0_1_publication.sha256'
      - 'research/rax_cqg/dust_collapse/reports/CST_DUST_Historienmass_Zustandsraum_N14_v0_1.pdf'
      - 'research/rax_cqg/dust_collapse/packages/CST_DUST_Historienmass_Zustandsraum_N14_v0_1_Pruefpaket.zip'
      - '.github/workflows/cst-dust-n14-history-state.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  n14-history-state-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
    defaults:
      run:
        working-directory: research/rax_cqg/dust_collapse
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify publication hashes and all archive entries
        run: |
          sha256sum -c history_measure_state_space_v0_1_publication.sha256
          unzip -q packages/CST_DUST_Historienmass_Zustandsraum_N14_v0_1_Pruefpaket.zip -d "$RUNNER_TEMP/n14-history-state"
          diff -qr history_measure_state_space_v0_1 "$RUNNER_TEMP/n14-history-state"
      - name: Replay the N14 weight, cut, scalar-sector and detector calculations
        run: |
          python -m pip install -r history_measure_state_space_v0_1/v05/upstream/v03/upstream/requirements.txt
          python -B "$RUNNER_TEMP/n14-history-state/verify.py"

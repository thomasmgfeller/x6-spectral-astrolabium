name: CSPP independent transfer admission
on:
  pull_request:
    paths: ['research/cspp/independent_transfer_v0_14/**', '.github/workflows/cspp-independent-transfer.yml']
  push:
    branches: [main]
    paths: ['research/cspp/independent_transfer_v0_14/**', '.github/workflows/cspp-independent-transfer.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  admission-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r research/cspp/independent_transfer_v0_14/requirements.txt
      - name: Verify structural bounds, decisions and no-run ordering
        run: python3 -B research/cspp/independent_transfer_v0_14/verify.py

name: CST-DUST coherent boundary readout
on:
  pull_request:
    paths:
      - 'research/rax_cqg/dust_collapse/boundary_readout_v0_1/**'
      - 'research/rax_cqg/dust_collapse/clock_intervals_v0_1/**'
      - 'research/rax_cqg/dust_collapse/relational_clock_v0_1/**'
      - 'research/rax_cqg/dust_collapse/marked_events_v0_1/**'
      - 'research/rax_cqg/dust_collapse/boundary_memory_v0_1/**'
      - 'research/rax_cqg/dust_collapse/quantum_structure_v0_1/**'
      - 'research/rax_cqg/dust_collapse/reports/CST_DUST_Kohaerente_Randauslese_Dekohaerenz_v0_1.pdf'
      - 'research/rax_cqg/dust_collapse/packages/CST_DUST_Kohaerente_Randauslese_Dekohaerenz_v0_1_Pruefpaket.zip'
      - '.github/workflows/cst-dust-boundary-readout.yml'
  push:
    branches: [main]
    paths:
      - 'research/rax_cqg/dust_collapse/boundary_readout_v0_1/**'
      - 'research/rax_cqg/dust_collapse/clock_intervals_v0_1/**'
      - 'research/rax_cqg/dust_collapse/relational_clock_v0_1/**'
      - 'research/rax_cqg/dust_collapse/marked_events_v0_1/**'
      - 'research/rax_cqg/dust_collapse/boundary_memory_v0_1/**'
      - 'research/rax_cqg/dust_collapse/quantum_structure_v0_1/**'
      - 'research/rax_cqg/dust_collapse/reports/CST_DUST_Kohaerente_Randauslese_Dekohaerenz_v0_1.pdf'
      - 'research/rax_cqg/dust_collapse/packages/CST_DUST_Kohaerente_Randauslese_Dekohaerenz_v0_1_Pruefpaket.zip'
      - '.github/workflows/cst-dust-boundary-readout.yml'

  workflow_dispatch:
permissions:
  contents: read
jobs:
  boundary-readout-integrity-and-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify original artifacts, six sources and conditional result scope
        run: python3 -O -B research/rax_cqg/dust_collapse/boundary_readout_v0_1/publication_check.py
      - name: Replay six exact results in isolation
        run: python3 -O -B research/rax_cqg/dust_collapse/boundary_readout_v0_1/publication_check.py --replay

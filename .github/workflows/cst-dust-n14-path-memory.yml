name: CST-DUST N14 path memory
on:
  pull_request:
    paths:
      - 'research/rax_cqg/dust_collapse/history_measure_state_space_v0_2/**'
      - 'research/rax_cqg/dust_collapse/history_measure_state_space_v0_2_publication.sha256'
      - 'research/rax_cqg/dust_collapse/reports/CST_DUST_Pfadgedaechtnis_N14_v0_2.pdf'
      - 'research/rax_cqg/dust_collapse/packages/CST_DUST_Pfadgedaechtnis_N14_v0_2_Pruefpaket.zip'
      - '.github/workflows/cst-dust-n14-path-memory.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  n14-path-memory-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
    defaults:
      run:
        working-directory: research/rax_cqg/dust_collapse
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify publication hashes and all archive entries
        run: |
          sha256sum -c history_measure_state_space_v0_2_publication.sha256
          unzip -q packages/CST_DUST_Pfadgedaechtnis_N14_v0_2_Pruefpaket.zip -d "$RUNNER_TEMP/n14-path-memory"
          diff -qr history_measure_state_space_v0_2 "$RUNNER_TEMP/n14-path-memory"
      - name: Replay the N14 prefix, growth, boundary and detector calculations
        run: |
          python -m pip install -r history_measure_state_space_v0_2/prior/v05/upstream/v03/upstream/requirements.txt scipy==1.17.0
          python -B "$RUNNER_TEMP/n14-path-memory/verify.py"

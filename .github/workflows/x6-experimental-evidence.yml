name: X6 Experimental Evidence CI

on:
  pull_request:
    paths:
      - 'experimental/evidence_calibration/**'
      - '.github/workflows/x6-experimental-evidence.yml'
  push:
    branches: [main]
    paths:
      - 'experimental/evidence_calibration/**'
      - '.github/workflows/x6-experimental-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-evidence-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, previously executed revision
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, previously executed revision
        with:
          python-version: '3.12'
      - name: Compile experimental modules
        run: python -m compileall -q experimental/evidence_calibration
      - name: Run regression and independent reference qualification
        shell: bash
        run: |
          set -euo pipefail
          python -m experimental.evidence_calibration.run_qualification --output evidence-output --protect-research 2>&1 | tee qualification-console.log
      - name: Preserve sources, environment and failed or successful results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, previously executed revision
        with:
          name: x6-experimental-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence-output/
            qualification-console.log
          if-no-files-found: error
          retention-days: 30

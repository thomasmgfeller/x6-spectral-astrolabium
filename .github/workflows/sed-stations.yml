name: Swiss station arrival comparison
on:
  pull_request:
    paths:
      - 'agent/sed*'
      - 'app/causal-stability/sed*'
      - 'app/causal-stability/sed-data/**'
      - 'tests/python/test_sed*.py'
      - 'research/sed_filter_prediction/**'
      - '.github/workflows/sed-stations.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r agent/sed-requirements.txt
      - run: python -m unittest discover -s tests/python -p 'test_sed*.py' -v
      - name: Replay the sealed paired prediction test without SED downloads
        run: python -m agent.sed_prediction verify --prediction-sha256 d03e62ce1eda687670b162864237fb472cf97ac2278984b3a33a95eff815f755

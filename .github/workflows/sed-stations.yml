name: Swiss station arrival comparison
on:
  pull_request:
    paths:
      - 'agent/sed*'
      - 'app/causal-stability/sed*'
      - 'app/causal-stability/sed-data/**'
      - 'tests/python/test_sed_three_station.py'
      - '.github/workflows/sed-stations.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r agent/sed-requirements.txt
      - run: python -m unittest discover -s tests/python -p test_sed_three_station.py -v

name: CST-DUST extended sewing
on:
  pull_request:
    paths:
      - 'research/rax_cqg/dust_collapse/extended_sewing_v0_1/**'
      - 'research/rax_cqg/dust_collapse/packages/CST_DUST_Erweiterte_Verklebungsregel_v0_1_Pruefpaket.zip'
      - '.github/workflows/cst-dust-extended-sewing.yml'
  push:
    branches: [main]
    paths:
      - 'research/rax_cqg/dust_collapse/extended_sewing_v0_1/**'
      - 'research/rax_cqg/dust_collapse/packages/CST_DUST_Erweiterte_Verklebungsregel_v0_1_Pruefpaket.zip'
      - '.github/workflows/cst-dust-extended-sewing.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extended-sewing:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned algebra and interval arithmetic
        run: python -m pip install -r research/rax_cqg/dust_collapse/extended_sewing_v0_1/requirements.txt
      - name: Verify extended sewing, 10 test groups and byte-identical replay
        run: python -B research/rax_cqg/dust_collapse/extended_sewing_v0_1/verify.py
      - name: Check downloadable package matches the published sources
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, zipfile
          root = Path('research/rax_cqg/dust_collapse/extended_sewing_v0_1')
          archive = root.parent / 'packages/CST_DUST_Erweiterte_Verklebungsregel_v0_1_Pruefpaket.zip'
          prefix = 'extended_sewing_v0_1/'
          paths = set(json.loads((root / 'MANIFEST.sha256.json').read_text())) | {'MANIFEST.sha256.json'}
          with zipfile.ZipFile(archive) as z:
              if z.testzip() is not None:
                  raise SystemExit('ZIP CRC failure')
              if len(z.namelist()) != len(paths) or set(z.namelist()) != {prefix + p for p in paths}:
                  raise SystemExit('ZIP inventory mismatch')
              for p in paths:
                  if z.read(prefix + p) != (root / p).read_bytes():
                      raise SystemExit('ZIP/source mismatch: ' + p)
          print('PASS: downloadable ZIP matches all 28 published package files.')
          PY

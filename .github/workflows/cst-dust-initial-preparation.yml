name: CST-DUST initial preparation
on:
  pull_request:
    paths:
      - 'research/rax_cqg/dust_collapse/initial_preparation_v0_1/**'
      - 'research/rax_cqg/dust_collapse/physical_boundary_readout_v0_1/checks/ward_clock/check.py'
      - 'research/rax_cqg/dust_collapse/physical_boundary_readout_v0_1/requirements.txt'
      - 'research/rax_cqg/dust_collapse/packages/CST_DUST_Anfangspraeparation_v0_1_Pruefpaket.zip'
      - 'research/rax_cqg/dust_collapse/reports/CST_DUST_Anfangspraeparation_v0_1.pdf'
      - '.github/workflows/cst-dust-initial-preparation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  initial-preparation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      OPENBLAS_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install finite-replay dependencies
        run: python -m pip install -r research/rax_cqg/dust_collapse/physical_boundary_readout_v0_1/requirements.txt
      - name: Check archive parity and replay packaged experiments
        shell: bash
        run: |
          dust=research/rax_cqg/dust_collapse
          archive="$dust/packages/CST_DUST_Anfangspraeparation_v0_1_Pruefpaket.zip"
          output=$(mktemp -d)
          unzip -q "$archive" -d "$output"
          for file in $(unzip -Z1 "$archive"); do cmp "$file" "$output/$file"; done
          python -B "$output/$dust/initial_preparation_v0_1/verify.py"

name: Eigenzeit three geometries v0.3
on:
  pull_request:
    paths:
      - 'research/eigenzeit/three_geometries_v0_3/**'
      - 'app/eigenzeit-kruemmungsintervalle/**'
      - '.github/workflows/eigenzeit-three-geometries.yml'
      - 'tools/workflow/requirements-research.txt'
  push:
    branches: [main]
    paths:
      - 'research/eigenzeit/three_geometries_v0_3/**'
      - 'app/eigenzeit-kruemmungsintervalle/**'
      - '.github/workflows/eigenzeit-three-geometries.yml'
      - 'tools/workflow/requirements-research.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned research dependencies
        run: python -m pip install -r tools/workflow/requirements-research.txt
      - name: Replay both certificates, all group counts, pilot decisions and the viewer
        run: python -B research/eigenzeit/three_geometries_v0_3/publication_check.py --replay --cpu-baseline --workers 2

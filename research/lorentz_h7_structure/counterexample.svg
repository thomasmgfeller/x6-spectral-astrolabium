<svg xmlns="http://www.w3.org/2000/svg" width="920" height="460" viewBox="0 0 920 460" role="img" aria-labelledby="title desc">
<title id="title">Minimal H7 counterexample: two different causal orders</title>
<desc id="desc">Exact Hasse diagrams, future upward. Left order n7-0475 has one isolated element and 154 linear extensions; right order n7-0734 is connected and has 162. Both have the same H7 signature.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#43546b"/></marker></defs>
<rect width="920" height="460" fill="#f7f9fc"/>
<g font-family="sans-serif" fill="#172b47">
<text x="460" y="30" text-anchor="middle" font-size="21" font-weight="bold">Different orders, identical H7 signature</text>
<g transform="translate(20,40)">
<text x="200" y="22" text-anchor="middle" font-size="18">n7-0475</text>
<line x1="148.730" y1="296.867" x2="348.379" y2="105.898" stroke="#43546b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="139.211" y1="291.472" x2="179.903" y2="112.428" stroke="#43546b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="297.219" y1="295.941" x2="225.471" y2="217.019" stroke="#43546b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="318.497" y1="293.006" x2="354.714" y2="220.572" stroke="#43546b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="205.789" y1="181.472" x2="190.097" y2="112.428" stroke="#43546b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="365.000" y1="181.000" x2="365.000" y2="113.000" stroke="#43546b" stroke-width="2" marker-end="url(#arrow)"/>
<circle cx="60" cy="200" r="18" fill="#ffe3a3" stroke="#244f7c" stroke-width="2"/><text x="60" y="205" text-anchor="middle" font-size="16">0</text>
<circle cx="135" cy="310" r="18" fill="#dbeafa" stroke="#244f7c" stroke-width="2"/><text x="135" y="315" text-anchor="middle" font-size="16">1</text>
<circle cx="310" cy="310" r="18" fill="#dbeafa" stroke="#244f7c" stroke-width="2"/><text x="310" y="315" text-anchor="middle" font-size="16">2</text>
<circle cx="210" cy="200" r="18" fill="#dbeafa" stroke="#244f7c" stroke-width="2"/><text x="210" y="205" text-anchor="middle" font-size="16">3</text>
<circle cx="365" cy="200" r="18" fill="#dbeafa" stroke="#244f7c" stroke-width="2"/><text x="365" y="205" text-anchor="middle" font-size="16">4</text>
<circle cx="365" cy="90" r="18" fill="#dbeafa" stroke="#244f7c" stroke-width="2"/><text x="365" y="95" text-anchor="middle" font-size="16">5</text>
<circle cx="185" cy="90" r="18" fill="#dbeafa" stroke="#244f7c" stroke-width="2"/><text x="185" y="95" text-anchor="middle" font-size="16">6</text>
<text x="200" y="360" text-anchor="middle" font-size="15">1 isolated; 154 linear extensions</text></g>
<g transform="translate(480,40)">
<text x="200" y="22" text-anchor="middle" font-size="18">n7-0734</text>
<line x1="63.399" y1="291.306" x2="95.886" y2="112.629" stroke="#43546b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="361.192" y1="291.385" x2="324.609" y2="112.533" stroke="#43546b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="232.032" y1="295.295" x2="295.436" y2="217.801" stroke="#43546b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="209.799" y1="293.970" x2="162.348" y2="219.404" stroke="#43546b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="165.952" y1="189.678" x2="300.690" y2="102.495" stroke="#43546b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="142.138" y1="182.703" x2="109.517" y2="110.938" stroke="#43546b" stroke-width="2" marker-end="url(#arrow)"/>
<circle cx="60" cy="310" r="18" fill="#dbeafa" stroke="#244f7c" stroke-width="2"/><text x="60" y="315" text-anchor="middle" font-size="16">0</text>
<circle cx="365" cy="310" r="18" fill="#dbeafa" stroke="#244f7c" stroke-width="2"/><text x="365" y="315" text-anchor="middle" font-size="16">1</text>
<circle cx="220" cy="310" r="18" fill="#dbeafa" stroke="#244f7c" stroke-width="2"/><text x="220" y="315" text-anchor="middle" font-size="16">2</text>
<circle cx="310" cy="200" r="18" fill="#dbeafa" stroke="#244f7c" stroke-width="2"/><text x="310" y="205" text-anchor="middle" font-size="16">3</text>
<circle cx="150" cy="200" r="18" fill="#dbeafa" stroke="#244f7c" stroke-width="2"/><text x="150" y="205" text-anchor="middle" font-size="16">4</text>
<circle cx="320" cy="90" r="18" fill="#dbeafa" stroke="#244f7c" stroke-width="2"/><text x="320" y="95" text-anchor="middle" font-size="16">5</text>
<circle cx="100" cy="90" r="18" fill="#dbeafa" stroke="#244f7c" stroke-width="2"/><text x="100" y="95" text-anchor="middle" font-size="16">6</text>
<text x="200" y="360" text-anchor="middle" font-size="15">0 isolated; 162 linear extensions</text></g>
<text x="460" y="438" text-anchor="middle" font-size="14">Hasse edges only; the calculation uses the full transitive relation. Future points upward.</text>
</g></svg>
